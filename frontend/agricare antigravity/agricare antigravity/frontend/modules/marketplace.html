<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Marketplace | AgriSmart</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;900&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            font-family: 'Poppins', sans-serif;
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.4);
        }
    </style>
</head>

<body class="bg-gray-50 text-gray-900">
    <div class="min-h-screen flex flex-col relative overflow-hidden">
        <!-- Decoration -->
        <div class="absolute top-0 right-0 w-96 h-96 bg-emerald-100 rounded-full blur-3xl opacity-30 -mr-48 -mt-48">
        </div>

        <!-- Header -->
        <header class="glass-card sticky top-0 z-50 border-b border-gray-100">
            <div class="max-w-7xl mx-auto py-4 px-4 sm:px-6 lg:px-8 flex justify-between items-center">
                <div class="flex items-center gap-8">
                    <div class="flex items-center gap-3">
                        <div
                            class="w-10 h-10 bg-gradient-to-br from-yellow-400 to-orange-500 rounded-xl flex items-center justify-center text-white text-xl shadow-lg">
                            <i class="fas fa-wheat-awn"></i>
                        </div>
                        <span class="text-xl font-black text-gray-800 tracking-tight hidden md:block">AgriSmart
                            Market</span>
                    </div>
                    <!-- Search -->
                    <div class="relative group hidden sm:block">
                        <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
                            <i data-lucide="search"
                                class="h-4 w-4 text-gray-400 group-focus-within:text-emerald-500 transition-colors"></i>
                        </div>
                        <input type="text" placeholder="Search crops, seeds, organic bulk..."
                            class="block w-64 md:w-96 pl-11 pr-4 py-2.5 bg-gray-100/50 border border-transparent rounded-2xl text-xs font-bold text-gray-900 focus:outline-none focus:ring-2 focus:ring-emerald-500/20 focus:border-emerald-500 transition-all placeholder:text-gray-400">
                    </div>
                </div>

                <div class="flex items-center gap-2 sm:gap-6">
                    <button
                        class="w-10 h-10 glass-card rounded-xl flex items-center justify-center text-gray-600 hover:text-emerald-600 transition-all relative">
                        <i data-lucide="shopping-cart" class="w-5 h-5"></i>
                        <span
                            class="absolute -top-1 -right-1 flex h-4 w-4 items-center justify-center rounded-full bg-emerald-600 text-[10px] font-black text-white">2</span>
                    </button>
                    <a href="../dashboard/buyer.html"
                        class="flex items-center text-[10px] font-black text-emerald-600 hover:text-emerald-700 tracking-widest uppercase transition-all">
                        <i data-lucide="layout-dashboard" class="w-4 h-4 mr-2"></i> My Dashboard
                    </a>
                </div>
            </div>
        </header>

        <main class="flex-1 max-w-7xl w-full mx-auto py-10 px-4 sm:px-6 lg:px-8 relative z-10">

            <!-- Title & Filters -->
            <div class="mb-12">
                <h2 class="text-4xl font-black text-gray-900 tracking-tight mb-6">Explore Fresh Produce</h2>
                <div class="flex flex-wrap gap-3">
                    <button
                        class="px-6 py-2.5 rounded-xl bg-emerald-600 text-white text-[10px] font-black uppercase tracking-widest shadow-lg shadow-emerald-500/20">All
                        Commodities</button>
                    <button
                        class="px-6 py-2.5 rounded-xl glass-card text-gray-500 text-[10px] font-black uppercase tracking-widest hover:text-emerald-600 transition-all">Grains
                        & Cereals</button>
                    <button
                        class="px-6 py-2.5 rounded-xl glass-card text-gray-500 text-[10px] font-black uppercase tracking-widest hover:text-emerald-600 transition-all">Vegetables</button>
                    <button
                        class="px-6 py-2.5 rounded-xl glass-card text-gray-500 text-[10px] font-black uppercase tracking-widest hover:text-emerald-600 transition-all">Seasonal
                        Fruits</button>
                </div>
            </div>

            <!-- Product Grid -->
            <div class="grid grid-cols-1 gap-8 sm:grid-cols-2 lg:grid-cols-4">

                <!-- Product 1 -->
                <div
                    class="glass-card p-4 rounded-[2.5rem] shadow-xl hover:shadow-2xl transition-all border border-gray-100 group">
                    <div class="relative aspect-square rounded-[1.5rem] overflow-hidden mb-4 shadow-inner bg-gray-200">
                        <img src="https://plus.unsplash.com/premium_photo-1675237625686-e97022d4f291?q=80&w=2670&auto=format&fit=crop"
                            alt="Premium Wheat"
                            class="h-full w-full object-cover group-hover:scale-110 transition-transform duration-700">
                        <div class="absolute top-4 left-4">
                            <span
                                class="px-4 py-1.5 bg-emerald-600 text-white text-[10px] font-black uppercase tracking-widest rounded-lg shadow-lg">ORGANIC</span>
                        </div>
                    </div>
                    <div class="px-2 pb-2">
                        <div class="flex justify-between items-start mb-2">
                            <div>
                                <h3 class="text-lg font-black text-gray-900 leading-tight">Premium Wheat</h3>
                                <p class="text-[10px] font-bold text-gray-400 uppercase tracking-widest mt-1">Raj-A1
                                    Grade</p>
                            </div>
                            <p class="text-lg font-black text-emerald-600">₹24,500<span
                                    class="text-[10px] text-gray-400 tracking-tighter uppercase ml-1">/Ton</span></p>
                        </div>
                        <div class="flex items-center gap-2 mb-6 text-xs font-bold text-gray-500">
                            <i data-lucide="map-pin" class="w-3.5 h-3.5 text-emerald-500"></i>
                            Mehsana, Gujarat
                        </div>
                        <button
                            class="w-full py-4 bg-gray-900 text-white text-[10px] font-black rounded-2xl tracking-widest uppercase hover:bg-emerald-600 transition-all shadow-lg active:scale-95 group-hover:bg-emerald-600">
                            ADD TO BASKET
                        </button>
                    </div>
                </div>

                <!-- Product 2 -->
                <div
                    class="glass-card p-4 rounded-[2.5rem] shadow-xl hover:shadow-2xl transition-all border border-gray-100 group">
                    <div class="relative aspect-square rounded-[1.5rem] overflow-hidden mb-4 shadow-inner bg-gray-200">
                        <img src="https://images.unsplash.com/photo-1590165482129-1b8b27698780?q=80&w=1000&auto=format&fit=crop"
                            alt="Fresh Potatoes"
                            class="h-full w-full object-cover group-hover:scale-110 transition-transform duration-700">
                        <div class="absolute top-4 left-4">
                            <span
                                class="px-4 py-1.5 bg-yellow-400 text-gray-900 text-[10px] font-black uppercase tracking-widest rounded-lg shadow-lg">FRESH
                                STOCK</span>
                        </div>
                    </div>
                    <div class="px-2 pb-2">
                        <div class="flex justify-between items-start mb-2">
                            <div>
                                <h3 class="text-lg font-black text-gray-900 leading-tight">Golden Potato</h3>
                                <p class="text-[10px] font-bold text-gray-400 uppercase tracking-widest mt-1">Direct
                                    from Farm</p>
                            </div>
                            <p class="text-lg font-black text-emerald-600">₹1,800<span
                                    class="text-[10px] text-gray-400 tracking-tighter uppercase ml-1">/Qntl</span></p>
                        </div>
                        <div class="flex items-center gap-2 mb-6 text-xs font-bold text-gray-500">
                            <i data-lucide="map-pin" class="w-3.5 h-3.5 text-emerald-500"></i>
                            Anand, Gujarat
                        </div>
                        <button
                            class="w-full py-4 bg-gray-900 text-white text-[10px] font-black rounded-2xl tracking-widest uppercase hover:bg-emerald-600 transition-all shadow-lg active:scale-95 group-hover:bg-emerald-600">
                            ADD TO BASKET
                        </button>
                    </div>
                </div>

                <!-- ... and more mockup products could follow ... -->
            </div>

        </main>
    </div>
    <script>lucide.createIcons();</script>
</body>

</html>
