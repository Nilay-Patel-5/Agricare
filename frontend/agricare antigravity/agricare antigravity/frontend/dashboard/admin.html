<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard | AgriSmart</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;900&display=swap"
        rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            font-family: 'Poppins', sans-serif;
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.4);
        }

        .sidebar-gradient {
            background: linear-gradient(180deg, #111827 0%, #1f2937 100%);
        }
    </style>
</head>

<body class="bg-gray-50 font-sans">

    <div class="flex h-screen overflow-hidden">
        <!-- Sidebar -->
        <div class="hidden md:flex md:flex-shrink-0">
            <div class="flex flex-col w-72">
                <div class="flex flex-col h-0 flex-1 sidebar-gradient shadow-2xl text-white">
                    <div class="flex-1 flex flex-col pt-8 pb-4 overflow-y-auto">
                        <div class="flex items-center flex-shrink-0 px-6 mb-10">
                            <div
                                class="w-10 h-10 bg-gradient-to-br from-yellow-400 to-orange-500 rounded-xl flex items-center justify-center text-white text-xl shadow-lg mr-3">
                                <i class="fas fa-wheat-awn"></i>
                            </div>
                            <span class="text-2xl font-black text-white tracking-tight">AgriSmart</span>
                        </div>

                        <nav class="mt-5 flex-1 px-4 space-y-2">
                            <a href="#"
                                class="bg-white/10 text-white group flex items-center px-4 py-3 text-sm font-bold rounded-2xl w-full border border-white/10">
                                <i data-lucide="layout-dashboard" class="mr-3 h-5 w-5 text-emerald-300"></i>
                                Dashboard
                            </a>
                            <a href="#"
                                class="text-gray-300 hover:bg-white/5 hover:text-white group flex items-center px-4 py-3 text-sm font-bold rounded-2xl w-full transition-all">
                                <i data-lucide="users" class="mr-3 h-5 w-5 text-emerald-300"></i>
                                User Management
                            </a>
                            <a href="#"
                                class="text-gray-300 hover:bg-white/5 hover:text-white group flex items-center px-4 py-3 text-sm font-bold rounded-2xl w-full transition-all">
                                <i data-lucide="settings" class="mr-3 h-5 w-5 text-emerald-300"></i>
                                System Settings
                            </a>
                        </nav>
                    </div>

                    <div class="flex-shrink-0 flex p-6 mb-4">
                        <a href="../index.html"
                            class="flex items-center w-full group p-4 bg-red-500/10 hover:bg-red-500/20 rounded-2xl transition-all border border-red-500/20">
                            <i data-lucide="log-out" class="h-5 w-5 text-red-400 mr-3"></i>
                            <span
                                class="text-sm font-bold text-white group-hover:text-red-200 uppercase tracking-widest">Sign
                                Out</span>
                        </a>
                    </div>
                </div>
            </div>
        </div>

        <!-- Main content -->
        <div class="flex-1 flex flex-col w-0 overflow-hidden relative">
            <div class="absolute top-0 right-0 w-96 h-96 bg-gray-200 rounded-full blur-3xl opacity-20 -mr-48 -mt-48">
            </div>

            <main class="flex-1 relative overflow-y-auto focus:outline-none p-8">
                <div class="max-w-7xl mx-auto">
                    <div class="flex justify-between items-center mb-10">
                        <div>
                            <h1 class="text-4xl font-black text-gray-900 tracking-tight">Admin Console</h1>
                            <p class="text-gray-500 font-medium">System Administration & Oversight</p>
                        </div>
                        <div class="flex items-center gap-4">
                            <div class="flex items-center gap-3 p-2 pr-4 glass-card rounded-2xl border border-gray-200">
                                <div
                                    class="w-10 h-10 bg-gray-800 rounded-xl flex items-center justify-center text-white font-bold">
                                    A</div>
                                <div class="hidden sm:block">
                                    <p class="text-xs font-bold text-gray-900 leading-none">Administrator</p>
                                    <p class="text-[10px] font-bold text-emerald-600 uppercase tracking-widest">Super
                                        User</p>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- Stats Grid -->
                    <div class="grid grid-cols-1 gap-6 sm:grid-cols-2 lg:grid-cols-4 mb-10">
                        <div
                            class="glass-card overflow-hidden rounded-[2rem] shadow-xl border border-gray-100 p-8 group transition-all hover:shadow-2xl">
                            <dt class="text-xs font-bold text-gray-400 uppercase tracking-widest mb-1">Total Active</dt>
                            <p class="text-lg font-bold text-gray-900 mb-2">Systems Users</p>
                            <dd class="text-4xl font-black text-gray-900">1,248</dd>
                            <div
                                class="mt-4 flex items-center text-sm font-bold text-emerald-600 uppercase tracking-widest">
                                <i data-lucide="trending-up" class="w-4 h-4 mr-2"></i> +5.4%
                            </div>
                        </div>
                        <div
                            class="glass-card overflow-hidden rounded-[2rem] shadow-xl border border-gray-100 p-8 group transition-all hover:shadow-2xl">
                            <dt class="text-xs font-bold text-gray-400 uppercase tracking-widest mb-1">Total Monthly
                            </dt>
                            <p class="text-lg font-bold text-gray-900 mb-2">Transactions</p>
                            <dd class="text-4xl font-black text-gray-900">₹54.2k</dd>
                            <div
                                class="mt-4 flex items-center text-sm font-bold text-emerald-600 uppercase tracking-widest">
                                <i data-lucide="trending-up" class="w-4 h-4 mr-2"></i> +12%
                            </div>
                        </div>
                    </div>
                </div>
            </main>
        </div>
    </div>
    <script>
        lucide.createIcons();
    </script>
</body>

</html>
