<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register | AgriSmart</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;900&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            font-family: 'Poppins', sans-serif;
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.82);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.5);
        }
    </style>
</head>

<body
    class="bg-gradient-to-br from-emerald-50 via-white to-teal-50 min-h-screen flex items-center justify-center py-12 px-4 sm:px-6 lg:px-8">

    <div
        class="max-w-md w-full space-y-8 glass-card p-10 rounded-[2.5rem] shadow-2xl border border-white relative overflow-hidden">
        <!-- Decoration -->
        <div class="absolute -top-12 -left-12 w-40 h-40 bg-yellow-100 rounded-full blur-3xl opacity-60"></div>
        <div class="absolute -bottom-12 -right-12 w-40 h-40 bg-emerald-100 rounded-full blur-3xl opacity-60"></div>

        <div class="text-center relative z-10">
            <a href="../index.html" class="inline-flex items-center gap-3 group mb-6">
                <div
                    class="w-12 h-12 bg-gradient-to-br from-yellow-400 to-emerald-600 rounded-xl flex items-center justify-center text-white text-xl shadow-lg group-hover:scale-110 transition-transform">
                    <i class="fas fa-wheat-awn"></i>
                </div>
                <span class="text-2xl font-black text-gray-800 tracking-tight">AgriSmart</span>
            </a>
            <h2 class="text-3xl font-black text-gray-900 tracking-tight">Join AgriSmart</h2>
            <p class="mt-2 text-sm text-gray-500 font-medium">
                Already have an account? <a href="login.html"
                    class="text-emerald-600 hover:text-emerald-700 font-bold underline decoration-2 underline-offset-4">Log
                    in</a>
            </p>
        </div>

        <!-- Role Toggle -->
        <div class="flex justify-center mb-8 relative z-10">
            <div class="bg-gray-100/50 p-1.5 rounded-2xl inline-flex w-full">
                <button onclick="toggleRole('farmer')" id="reg-btn-farmer"
                    class="flex-1 py-2.5 text-xs font-bold rounded-xl bg-white shadow-sm text-emerald-700 transition-all">I'M
                    A FARMER</button>
                <button onclick="toggleRole('buyer')" id="reg-btn-buyer"
                    class="flex-1 py-2.5 text-xs font-bold rounded-xl text-gray-500 hover:text-gray-700 transition-all">I'M
                    A BUYER</button>
            </div>
        </div>

        <form class="mt-8 space-y-5 relative z-10" action="#" method="POST" onsubmit="handleRegister(event)">
            <input type="hidden" name="role" id="reg-role-input" value="farmer">

            <div class="grid grid-cols-2 gap-4">
                <div>
                    <label class="block text-xs font-bold text-gray-500 uppercase tracking-widest mb-1 ml-1">First
                        Name</label>
                    <input id="first-name" name="first-name" type="text" required
                        class="appearance-none rounded-2xl relative block w-full px-4 py-3 border border-gray-200 placeholder-gray-400 text-gray-900 focus:outline-none focus:ring-2 focus:ring-emerald-500/20 focus:border-emerald-500 transition-all sm:text-sm"
                        placeholder="John">
                </div>
                <div>
                    <label class="block text-xs font-bold text-gray-500 uppercase tracking-widest mb-1 ml-1">Last
                        Name</label>
                    <input id="last-name" name="last-name" type="text" required
                        class="appearance-none rounded-2xl relative block w-full px-4 py-3 border border-gray-200 placeholder-gray-400 text-gray-900 focus:outline-none focus:ring-2 focus:ring-emerald-500/20 focus:border-emerald-500 transition-all sm:text-sm"
                        placeholder="Doe">
                </div>
            </div>

            <div>
                <label class="block text-xs font-bold text-gray-500 uppercase tracking-widest mb-1 ml-1">Email
                    Address</label>
                <input id="email-address" name="email" type="email" autocomplete="email" required
                    class="appearance-none rounded-2xl relative block w-full px-4 py-3 border border-gray-200 placeholder-gray-400 text-gray-900 focus:outline-none focus:ring-2 focus:ring-emerald-500/20 focus:border-emerald-500 transition-all sm:text-sm"
                    placeholder="john@example.com">
            </div>

            <div>
                <label class="block text-xs font-bold text-gray-500 uppercase tracking-widest mb-1 ml-1">Phone
                    Number</label>
                <input id="phone" name="phone" type="tel" autocomplete="tel" required
                    class="appearance-none rounded-2xl relative block w-full px-4 py-3 border border-gray-200 placeholder-gray-400 text-gray-900 focus:outline-none focus:ring-2 focus:ring-emerald-500/20 focus:border-emerald-500 transition-all sm:text-sm"
                    placeholder="+91 98765 43210">
            </div>

            <div>
                <label
                    class="block text-xs font-bold text-gray-500 uppercase tracking-widest mb-1 ml-1">Password</label>
                <input id="password" name="password" type="password" autocomplete="new-password" required
                    class="appearance-none rounded-2xl relative block w-full px-4 py-3 border border-gray-200 placeholder-gray-400 text-gray-900 focus:outline-none focus:ring-2 focus:ring-emerald-500/20 focus:border-emerald-500 transition-all sm:text-sm"
                    placeholder="••••••••">
            </div>

            <div class="flex items-start">
                <div class="flex items-center h-5">
                    <input id="terms" name="terms" type="checkbox" required
                        class="h-4 w-4 text-emerald-600 focus:ring-emerald-500 border-gray-300 rounded-lg">
                </div>
                <div class="ml-3 text-sm">
                    <label for="terms" class="text-gray-500 font-medium">
                        I agree to the <a href="#" class="text-emerald-600 hover:text-emerald-700 font-bold">Terms and
                            Conditions</a>
                    </label>
                </div>
            </div>

            <div>
                <button type="submit"
                    class="group relative w-full flex justify-center py-4 px-4 border border-transparent text-sm font-bold rounded-2xl text-white bg-gradient-to-r from-emerald-500 to-teal-700 hover:from-emerald-600 hover:to-teal-800 shadow-lg hover:shadow-emerald-500/30 hover:-translate-y-0.5 transition-all">
                    CREATE ACCOUNT
                </button>
            </div>
        </form>
    </div>

    <script>
        function toggleRole(role) {
            ['farmer', 'buyer'].forEach(r => {
                const btn = document.getElementById(`reg-btn-${r}`);
                if (r === role) {
                    btn.classList.remove('text-gray-500', 'hover:text-gray-700');
                    btn.classList.add('bg-white', 'shadow-sm', 'text-emerald-700');
                } else {
                    btn.classList.remove('bg-white', 'shadow-sm', 'text-emerald-700');
                    btn.classList.add('text-gray-500', 'hover:text-gray-700');
                }
            });
            document.getElementById('reg-role-input').value = role;
        }

        function handleRegister(e) {
            e.preventDefault();
            alert('Account created! Please log in.');
            window.location.href = 'login.html';
        }
    </script>
</body>

</html>
